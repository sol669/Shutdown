name: Build Windows release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj -r win-x64

      - name: Publish portable app
        run: dotnet publish Shutdown-WinUI3-Source/src/Shutdown/Shutdown.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:EnableMsixTooling=true -o publish

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath Shutdown-Trey-Portable-win-x64.zip -CompressionLevel Optimal

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            /DAppVersion=1.0.0 `
            "/DPublishDir=${{ github.workspace }}\publish" `
            "${{ github.workspace }}\installer\Shutdown.iss"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shutdown-Portable-win-x64
          path: Shutdown-Trey-Portable-win-x64.zip
          if-no-files-found: error
          compression-level: 9

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shutdown-Trey-Setup-win-x64
          path: release/Shutdown-Trey-Setup-v1.0.0.exe
          if-no-files-found: error
          compression-level: 0

      - name: Add files to GitHub release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          files: |
            Shutdown-Trey-Portable-win-x64.zip
            release/Shutdown-Trey-Setup-v1.0.0.exe
          fail_on_unmatched_files: true
          overwrite_files: true
